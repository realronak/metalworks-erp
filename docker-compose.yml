services:
  db:
    image: postgres:16-alpine
    container_name: metalworks-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metalworks_erp
      POSTGRES_USER: metalworks_admin
      POSTGRES_PASSWORD: metalworks_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metalworks_admin -d metalworks_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: metalworks-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: metalworks_erp
      DB_USER: metalworks_admin
      DB_PASSWORD: metalworks_secret_password
      JWT_SECRET: super_secret_production_key_replace_this_with_random_string
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: metalworks-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  pgdata:
